
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/sanjeev-kumar-lodhi/LinkedIn-clone-config-server
          default-label: main  


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      
  instance:
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    prefer-ip-address: true
